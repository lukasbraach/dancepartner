name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt is the lock (this project uses pip + venv, not uv);
          # the editable install then wires up the package itself.
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest --cov=src/dancepartner --cov-report=term-missing --cov-fail-under=90

      - name: CLI smoke test
        run: |
          dancepartner check data/team.example.yaml
          dancepartner solve data/team.example.yaml --json /tmp/out.json
          dancepartner explain data/team.example.yaml /tmp/out.json --dancer lukas-b
          # The 24-dancer instance the README's performance table is measured on. Only
          # `check` -- a full solve of it takes ~12 s, which is not worth the CI minute.
          dancepartner check data/team.large.example.yaml

      - name: The core runs without the solver
        # SPEC.md 14: the browser build imports the data model with no ortools present. That
        # combination exists nowhere else in CI, and the failure mode -- an eager
        # `from .solver import ...` creeping back into dancepartner/__init__.py -- is invisible
        # until a coach opens the Pages site and gets a white page.
        run: |
          pip uninstall -y ortools
          python -c "import dancepartner; from dancepartner.model import Team; print(Team)"
          python -c "import dancepartner; assert 'solve' in dir(dancepartner)"
          pip install -c requirements-dev.txt ortools

      - name: The core runs without the UI
        # SPEC.md 5: a reviewer must be able to delete app/ and still run everything from the
        # CLI. Prove it rather than trusting the import graph.
        run: |
          mv app /tmp/app-moved
          pip uninstall -y streamlit
          dancepartner solve data/team.example.yaml
          mv /tmp/app-moved app

  highs-backend:
    # SPEC.md 8.1: the second backend is validated by running the *existing* suite against it,
    # not by a parallel set of tests -- tests/helpers.py::assert_result_valid re-derives every
    # hard constraint and stage value independently of whichever solver produced them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: The suite, on HiGHS
        run: pytest --backend=highs

      - name: Coverage, combined across both backends
        # Neither backend alone can reach the project's 100%: whichever one is idle looks
        # dead. The `checks` job keeps the 90% gate on a single run; this is the real figure.
        run: |
          COVERAGE_FILE=.coverage.cpsat pytest --cov=src/dancepartner --cov-report=
          COVERAGE_FILE=.coverage.highs pytest --backend=highs --cov=src/dancepartner --cov-report=
          coverage combine .coverage.cpsat .coverage.highs
          coverage report --show-missing --fail-under=99

      - name: Both backends agree from the command line
        run: |
          dancepartner solve data/team.example.yaml --backend cpsat --json /tmp/cpsat.json
          dancepartner solve data/team.example.yaml --backend highs --json /tmp/highs.json
          python - <<'PY'
          import json
          def stages(path):
              with open(path) as fh:
                  return [(s["name"], s["value"]) for s in json.load(fh)["result"]["stages"]]
          a, b = stages("/tmp/cpsat.json"), stages("/tmp/highs.json")
          assert a == b, f"backends disagree:\n  cpsat {a}\n  highs {b}"
          print("stage vectors match:", a)
          PY

  wasm-parity:
    # SPEC.md 14: the browser target runs this core on CPython 3.13 against pydantic 2.12.5,
    # neither of which the job above exercises, and with no ortools at all. A validator that
    # silently stops firing on the older pydantic would corrupt teams rather than crash, which
    # is the worst failure mode available here -- so it gets its own job rather than a comment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # Pyodide 0.29.3, which @stlite/browser 1.8.1 loads, is 3.13.2

      - name: Install exactly what the browser has
        run: |
          python -m pip install --upgrade pip
          # The versions in wasm/requirements-wasm.txt, and deliberately no ortools.
          pip install -r wasm/requirements-wasm.txt pytest
          pip install -e . --no-deps

      - name: The browser-safe core behaves, and solves
        # Everything that does not need typer or streamlit, run on the browser's own solver.
        # This is the strongest check in the file: the same tests the reference implementation
        # passes, on CPython 3.13 with pydantic 2.12.5 and HiGHS, which is exactly what a coach
        # on the Pages build is running. The cross-backend cases importorskip ortools and skip.
        run: |
          pytest --backend=highs \
                 tests/test_model.py tests/test_storage.py tests/test_scoring.py \
                 tests/test_feasibility.py tests/test_i18n.py tests/test_wasm_deps.py \
                 tests/test_solver.py tests/test_objectives.py tests/test_enumeration.py \
                 tests/test_symmetry.py tests/test_reporting.py tests/test_milp.py \
                 tests/test_backends.py
