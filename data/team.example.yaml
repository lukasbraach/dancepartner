# Beispielteam für dancepartner — erfundene Daten, keine echte Teambefragung.
#
# Rollen:      leader (Herr) | follower (Dame)
# Flags:       is_pole_position   (Startanspruch: muss allein in der eigenen Rolle auf der
#                                 Position sein)
#              needs_coaching     (Coachingbedarf: darf NICHT allein in der eigenen Rolle sein)
#              Die beiden schließen sich gegenseitig aus.
# Wünsche:     desired / not_desired, jeweils  <tier>: [ids]  — Tier 1 ist der stärkste Wunsch.
#              Tiers müssen bei 1 beginnen und lückenlos sein, je Richtung.
#              Eine ID darf pro Richtung in nur einem Tier stehen und nie in beiden Richtungen.
#
# Trainervorgaben (optional, ganz am Ende der Datei):
#              coach_constraints:
#                together: [[lukas-b, anna-b]]   # teilen sich eine Position
#                apart:    [[jonas-k, lena-f]]   # nie auf derselben Position
#              Harte Regeln des Trainers, unabhängig von der Befragung. Sie benennen Tänzer:innen
#              und nie einen Positionsbuchstaben; die Positionen bleiben austauschbar.
#
# Die Reihenfolge der Tänzer:innen ist bedeutsam: die Symmetriebrechung des Solvers numeriert
# die Positionen nach dem Index der leader in dieser Liste.
#
# ACHTUNG: »dancepartner solve --save« o. Ä. gibt es nicht, aber save_team() aus storage.py
# schreibt diese Datei ohne Kommentare neu. Echte Daten gehören nach data/team.yaml
# (gitignored), nicht hierher.
