# Großes Beispielteam für dancepartner — erfundene Daten, keine echte Teambefragung.
#
# 24 Tänzer:innen (12 Herren, 12 Damen) auf 8 Positionen. Das ist die Größe, auf die sich die
# Performance-Angaben im README beziehen: je Rolle bleiben 4 Positionen einfach und 4 doppelt
# besetzt, und mit 22 beantworteten Teambefragungen über drei Tiers ist die Zielfunktion dicht
# genug besetzt, dass der Solver wirklich etwas zu entscheiden hat.
#
# Aufbau und Regeln wie in team.example.yaml:
#
# Rollen:      leader (Herr) | follower (Dame)
# Flags:       is_pole_position   (Startanspruch: muss allein in der eigenen Rolle auf der
#                                 Position sein)
#              needs_coaching     (Coachingbedarf: darf NICHT allein in der eigenen Rolle sein)
#              Die beiden schließen sich gegenseitig aus.
# Wünsche:     desired / not_desired, jeweils  <tier>: [ids]  — Tier 1 ist der stärkste Wunsch.
#              Tiers müssen bei 1 beginnen und lückenlos sein, je Richtung.
#              Eine ID darf pro Richtung in nur einem Tier stehen und nie in beiden Richtungen.
#
# Wünsche sind gerichtet: dass Finn sich Alina wünscht, heißt nicht, dass Alina sich Finn
# wünscht. Hier tun es die meisten, aber eben nicht alle — genau daran wird die Zielfunktion
# interessant.
#
# Trainervorgaben (optional, ganz am Ende der Datei):
#              coach_constraints:
#                together: [[finn-a, alina-o]]   # teilen sich eine Position
#                apart:    [[tobias-b, bettina-p]] # nie auf derselben Position
#              Harte Regeln des Trainers, unabhängig von der Befragung. Sie benennen Tänzer:innen
#              und nie einen Positionsbuchstaben; die Positionen bleiben austauschbar.
#
# Die Reihenfolge der Tänzer:innen ist bedeutsam: die Symmetriebrechung des Solvers numeriert
# die Positionen nach dem Index der leader in dieser Liste.
#
# Philipp Möller und Katharina Grothe haben nicht geantwortet — das ist Absicht. Wer keine
# Teambefragung abgibt, bekommt 0 Punkte und ist damit automatisch unter den Unzufriedensten.
