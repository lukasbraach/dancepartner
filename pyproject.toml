[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dancepartner"
version = "0.1.0"
description = "Happiness-optimized allocation of dancing partners in partner formation dancing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# The UI is an extra, not a runtime dependency: the core must stay installable -- and the CLI
# runnable -- with app/ deleted (SPEC.md 5). st.navigation/st.Page need >= 1.36.
ui = ["streamlit>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "streamlit>=1.40",  # tests/test_app.py drives the UI through streamlit.testing.
    "jinja2>=3.1",  # wasm/build_static.py renders the browser shell.
    "pillow>=10.0",  # wasm/make_icons.py draws the PWA icons.
]

[project.scripts]
dancepartner = "dancepartner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dancepartner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app", "wasm"]
# SPEC.md contains illustrative Python blocks; ruff reformats fenced code in Markdown and
# the spec is not ours to reformat.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "D"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "app", "wasm"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/dancepartner"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
