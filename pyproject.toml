[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dancepartner"
version = "0.1.0"
description = "Happiness-optimized allocation of dancing partners in partner formation dancing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "ortools>=9.10",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dancepartner"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# SPEC.md contains illustrative Python blocks; ruff reformats fenced code in Markdown and
# the spec is not ours to reformat.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "D"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN001", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/dancepartner"]
omit = ["src/dancepartner/i18n.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
